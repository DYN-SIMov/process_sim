[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synloop"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "pymoo",
    "joblib",
    "termcolor",
    "CoolProp",
    "chemicals",
    "thermo",
    "requests",
]

[project.optional-dependencies]
dev = ["pytest", "mypy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"thermodynamics.databases" = ["*.json"]
"thermodynamics.activity_models_regression" = ["thermo_data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
