[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synloop"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.3.0,<3",
    "scipy>=1.16.1,<2",
    "pandas>=2.3.1,<3",
    "matplotlib>=3.10.5,<4",
    "pymoo>=0.6.1.6,<0.7",
    "joblib>=1.5.3,<2",
    "termcolor>=3.2.0,<4",
    "CoolProp>=7.2.0,<8",
    "chemicals>=1.5.2,<2",
    "thermo>=0.6.1,<0.7",
    "requests>=2.34.2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0,<10",
    "mypy>=1.18.2,<2"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"thermodynamics.databases" = ["*.json"]
"thermodynamics.activity_models_regression" = ["thermo_data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--import-mode=importlib"]
markers = [
    "unit: fast, isolated tests (auto-applied to tests/unit)",
    "integration: tests combining several modules and/or thermo libraries (auto-applied to tests/integration)",
    "e2e: full regression workflows (auto-applied to tests/e2e)",
    "slow: long-running tests, e.g. genetic/memetic optimisation (deselect with -m 'not slow')",
    "todo: scaffolded test that is not implemented yet (skipped automatically)",
]
