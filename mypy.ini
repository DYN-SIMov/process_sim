[mypy]
python_version = 3.13
files = src
ignore_missing_imports = True
check_untyped_defs = True
warn_return_any = True
warn_unused_ignores = True
show_error_codes = True
# Work in progress: these modules depend on TEIXMLParser / PDFProcessingPipeline,
# which are not implemented yet.
exclude = (?x)(
    ^src/thermodynamics/parsers/  # work in progress
    | ^build/
    | ^docs/
  )
